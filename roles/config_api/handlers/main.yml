---
- name: Restart config API
  ansible.builtin.systemd_service:
    name: megaproxy-config-api
    daemon_reload: true
    state: restarted
  when: not ansible_check_mode

- name: Reload config API nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
  when: not ansible_check_mode

- name: Reload config API systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not ansible_check_mode
