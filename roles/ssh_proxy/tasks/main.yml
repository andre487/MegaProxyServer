---
- name: Validate ownership of SSH proxy accounts
  ansible.builtin.import_tasks: validate_accounts.yml

- name: Remove retired SSH proxy users
  ansible.builtin.user:
    name: "{{ item }}"
    state: absent
    remove: true
  loop: "{{ megaproxy_services.ssh.removed_users | default([]) }}"

- name: Remove authorized keys of retired SSH proxy users
  ansible.builtin.file:
    path: "/etc/ssh/megaproxy_authorized_keys/{{ item }}"
    state: absent
  loop: "{{ megaproxy_services.ssh.removed_users | default([]) }}"

- name: Configure enabled ssh_proxy service
  ansible.builtin.include_tasks: enabled.yml
  when: megaproxy_services.ssh.enabled | bool

- name: Disable ssh_proxy service
  ansible.builtin.include_tasks: disabled.yml
  when: not megaproxy_services.ssh.enabled | bool

- name: Remove inactive SSH fail2ban jail
  ansible.builtin.file:
    path: /etc/fail2ban/jail.d/megaproxy-sshd.local
    state: absent
  when: not megaproxy_services.ssh.enabled or not megaproxy_services.ssh.fail2ban
  notify: Restart fail2ban
