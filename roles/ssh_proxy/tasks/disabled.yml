---
- name: Deny all managed proxy accounts while keeping administrative SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/60-megaproxy.conf
    content: "DenyGroups megaproxy\n"
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Validate and reload ssh

- name: Keep only the administrative SSH port
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/59-megaproxy-limits.conf
    content: "Port {{ megaproxy_admin.port }}\n"
    owner: root
    group: root
    mode: "0644"
  notify: Validate and reload ssh

- name: Check whether the managed proxy group exists
  ansible.builtin.command: getent group megaproxy
  register: megaproxy_disabled_group
  changed_when: false
  failed_when: false
  check_mode: false

- name: Close sessions of disabled proxy accounts
  ansible.builtin.command:
    argv: [pkill, -KILL, -G, megaproxy]
  when: megaproxy_disabled_group.rc == 0
  register: megaproxy_disabled_sessions
  failed_when: megaproxy_disabled_sessions.rc not in [0, 1]
  changed_when: megaproxy_disabled_sessions.rc == 0
