---
- name: Validate HTTPS service variables
  ansible.builtin.assert:
    that:
      - megaproxy_services.https.users | length > 0

- name: Enable Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Create private configuration directory
  ansible.builtin.file:
    path: /opt/megaproxy
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Select certificate directory
  ansible.builtin.set_fact:
    megaproxy_certificate_directory: >-
      {{ '/opt/megaproxy/certificates' if megaproxy_services.https.certificate == 'self-signed'
         else '/etc/letsencrypt/live/' ~ megaproxy_services.https.endpoint }}
    megaproxy_container_certificate_directory: >-
      {{ '/certificates' if megaproxy_services.https.certificate == 'self-signed'
         else '/etc/letsencrypt/live/' ~ megaproxy_services.https.endpoint }}
    megaproxy_certificate_volume: >-
      {{ '/opt/megaproxy/certificates:/certificates:ro' if megaproxy_services.https.certificate == 'self-signed'
         else '/etc/letsencrypt:/etc/letsencrypt:ro' }}
    megaproxy_certificate_hostnames: "{{ megaproxy_services.https.routes | map(attribute='hostname') | list }}"

- name: Check current certificate
  ansible.builtin.stat:
    path: "{{ megaproxy_certificate_directory }}/fullchain.pem"
  register: megaproxy_certificate

- name: Check certificate hostnames
  ansible.builtin.command:
    argv: [openssl, x509, -checkhost, "{{ item }}", -noout, -in, "{{ megaproxy_certificate_directory }}/fullchain.pem"]
  loop: "{{ megaproxy_certificate_hostnames }}"
  register: megaproxy_certificate_hostname_checks
  changed_when: false
  failed_when: false
  when:
    - megaproxy_certificate.stat.exists
    - megaproxy_services.https.certificate == "domain"

- name: Decide whether the domain certificate must be issued
  ansible.builtin.set_fact:
    megaproxy_certificate_needs_issue: >-
      {{
        not megaproxy_certificate.stat.exists or
        (megaproxy_certificate_hostname_checks.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length > 0) or
        (megaproxy_certificate_hostname_checks.results | default([]) | selectattr('stdout', 'defined') | selectattr('stdout', 'search', 'does NOT match certificate') | list | length > 0)
      }}

- name: Create self-signed certificate directory
  ansible.builtin.file:
    path: /opt/megaproxy/certificates
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: megaproxy_services.https.certificate == "self-signed"

- name: Create self-signed certificate
  ansible.builtin.command:
    argv: [openssl, req, -x509, -newkey, rsa:3072, -nodes, -days, "365", -subj, "/CN={{ megaproxy_services.https.endpoint }}", -addext, "subjectAltName={{ megaproxy_https_san_type }}:{{ megaproxy_services.https.endpoint }}", -keyout, /opt/megaproxy/certificates/privkey.pem, -out, /opt/megaproxy/certificates/fullchain.pem]
  when:
    - megaproxy_services.https.certificate == "self-signed"
    - not megaproxy_certificate.stat.exists
  no_log: true

- name: Obtain domain certificate
  ansible.builtin.command:
    argv: >-
      {{
        ['docker', 'run', '--rm', '--network', 'host', '-v', '/etc/letsencrypt:/etc/letsencrypt',
         '-v', '/var/lib/letsencrypt:/var/lib/letsencrypt',
         'certbot/certbot:' ~ megaproxy_services.https.certbot_version,
         'certonly', '--standalone', '--non-interactive', '--agree-tos', '--no-eff-email', '--expand',
         '--cert-name', megaproxy_services.https.endpoint, '--email', megaproxy_services.https.acme_email]
        + (megaproxy_certificate_hostnames | map('regex_replace', '^(.*)$', '--domain=\1') | list)
      }}
  when:
    - megaproxy_services.https.certificate == "domain"
    - megaproxy_certificate_needs_issue | bool

- name: Obtain public IP certificate
  ansible.builtin.command:
    argv: [docker, run, --rm, --network, host, -v, /etc/letsencrypt:/etc/letsencrypt, -v, /var/lib/letsencrypt:/var/lib/letsencrypt, "certbot/certbot:{{ megaproxy_services.https.certbot_version }}", certonly, --standalone, --non-interactive, --agree-tos, --no-eff-email, --email, "{{ megaproxy_services.https.acme_email }}", --preferred-profile, shortlived, --ip-address, "{{ megaproxy_services.https.endpoint }}"]
  when:
    - megaproxy_services.https.certificate == "ip-acme"
    - not megaproxy_certificate.stat.exists

- name: Install active-probe decoy page
  ansible.builtin.template:
    src: decoy.html.j2
    dest: /opt/megaproxy/decoy.html
    owner: root
    group: root
    mode: "0644"
  notify: Restart MegaProxy GOST

- name: Install secret GOST configuration
  ansible.builtin.template:
    src: gost.yml.j2
    dest: /opt/megaproxy/gost.yml
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart MegaProxy GOST

- name: Install GOST systemd service
  ansible.builtin.template:
    src: megaproxy-gost.service.j2
    dest: /etc/systemd/system/megaproxy-gost.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart MegaProxy GOST

- name: Install SNI routing configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0644"
    validate: "{{ omit if ansible_check_mode else '/usr/sbin/haproxy -c -f %s' }}"
  notify: Restart MegaProxy HAProxy

- name: Activate GOST backends before the public SNI router
  ansible.builtin.meta: flush_handlers

- name: Check whether GOST predates the current certificate
  ansible.builtin.shell:
    cmd: >-
      test "{{ megaproxy_certificate_directory }}/fullchain.pem"
      -nt "/proc/$(systemctl show --property MainPID --value megaproxy-gost)"
  register: megaproxy_gost_certificate_is_newer
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Load a newer certificate into GOST
  ansible.builtin.systemd_service:
    name: megaproxy-gost
    state: restarted
    daemon_reload: true
  when:
    - not ansible_check_mode
    - megaproxy_gost_certificate_is_newer.rc == 0

- name: Install containerized certificate renewal service
  ansible.builtin.template:
    src: megaproxy-certbot-renew.service.j2
    dest: /etc/systemd/system/megaproxy-certbot-renew.service
    owner: root
    group: root
    mode: "0644"
  when: megaproxy_services.https.certificate != "self-signed"

- name: Install certificate renewal timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/megaproxy-certbot-renew.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Renew MegaProxy TLS certificate

      [Timer]
      OnBootSec=10min
      OnUnitActiveSec=12h
      RandomizedDelaySec=1h
      Persistent=true

      [Install]
      WantedBy=timers.target
  when: megaproxy_services.https.certificate != "self-signed"

- name: Enable certificate renewal timer
  ansible.builtin.systemd_service:
    name: megaproxy-certbot-renew.timer
    enabled: true
    state: started
    daemon_reload: true
  when:
    - megaproxy_services.https.certificate != "self-signed"
    - not ansible_check_mode

- name: Enable GOST service
  ansible.builtin.systemd_service:
    name: megaproxy-gost
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

- name: Enable HAProxy SNI router
  ansible.builtin.systemd_service:
    name: haproxy
    enabled: true
    state: started
  when: not ansible_check_mode
