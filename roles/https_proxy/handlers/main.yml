---
- name: Restart MegaProxy GOST
  ansible.builtin.systemd_service:
    name: megaproxy-gost
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode

- name: Restart MegaProxy HAProxy
  ansible.builtin.systemd_service:
    name: haproxy
    state: restarted
  when: not ansible_check_mode

- name: Clean MegaProxy Docker resources
  ansible.builtin.command: /usr/local/sbin/megaproxy-docker-clean
  register: megaproxy_docker_cleanup
  changed_when: >-
    'Deleted:' in megaproxy_docker_cleanup.stdout or
    'deleted:' in megaproxy_docker_cleanup.stdout or
    'Untagged:' in megaproxy_docker_cleanup.stdout
  when: not ansible_check_mode
