name: Host provisioning

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: provisioning-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transports:
    name: GOST HTTP3 and SOCKS5
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.12"

      - name: Install test dependencies
        run: uv sync --locked --all-groups

      - name: Download pinned GOST release
        run: |
          mkdir -p "$RUNNER_TEMP/megaproxy-gost"
          cd "$RUNNER_TEMP/megaproxy-gost"
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/go-gost/gost/releases/download/v3.3.0/gost_3.3.0_linux_amd64.tar.gz \
            --output gost_3.3.0_linux_amd64.tar.gz
          echo '676fb7f78d267b6ae73df719c0c7f2b565dde7147da935cfafbc1e1da558b6d5  gost_3.3.0_linux_amd64.tar.gz' | sha256sum --check
          tar -xzf gost_3.3.0_linux_amd64.tar.gz

      - name: Verify authenticated SOCKS5 and MASQUE TCP and UDP
        run: uv run --frozen python tests/integration/transports.py --gost "$RUNNER_TEMP/megaproxy-gost/gost"

  ubuntu:
    name: Ubuntu 24.04 host
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install and initialize LXD
        run: |
          sudo snap install lxd --channel=5.21/stable || sudo snap refresh lxd --channel=5.21/stable
          sudo lxd waitready
          sudo lxd init --auto

      - name: Provision and verify host
        run: tests/integration/lxd.sh ubuntu:24.04 1

  two-host-jump:
    name: Debian 12 two-host Jump
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install and initialize LXD
        run: |
          sudo snap install lxd --channel=5.21/stable || sudo snap refresh lxd --channel=5.21/stable
          sudo lxd waitready
          sudo lxd init --auto

      - name: Provision and verify two hosts and Jump
        run: tests/integration/lxd.sh images:debian/12/cloud 2
