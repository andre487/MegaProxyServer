---
- name: Verify MegaProxy servers
  hosts: all
  become: true
  gather_facts: false
  pre_tasks:
    - name: Check whether MegaProxy was applied
      ansible.builtin.stat:
        path: /etc/megaproxy/managed
      register: megaproxy_managed

    - name: Require an applied MegaProxy configuration
      ansible.builtin.assert:
        that: megaproxy_managed.stat.exists
        fail_msg: "This host has not been provisioned yet. Run './mega-proxy apply' before verify."

    - name: Check Docker installation
      ansible.builtin.stat:
        path: /usr/bin/docker
      register: megaproxy_docker
      when: megaproxy_services.https is defined and megaproxy_services.https.enabled | bool

    - name: Require Docker for HTTPS verification
      ansible.builtin.assert:
        that: megaproxy_docker.stat.exists
        fail_msg: "HTTPS provisioning is incomplete: /usr/bin/docker is missing. Run './mega-proxy apply'."
      when: megaproxy_services.https is defined and megaproxy_services.https.enabled | bool
  tasks:
    - name: Validate HAProxy configuration
      ansible.builtin.command: haproxy -c -f /etc/haproxy/haproxy.cfg
      changed_when: false
      when: megaproxy_services.https is defined and megaproxy_services.https.enabled | bool

    - name: Check HAProxy service state
      ansible.builtin.command: systemctl is-active haproxy
      register: haproxy_state
      changed_when: false
      when: megaproxy_services.https is defined and megaproxy_services.https.enabled | bool

    - name: Read local HTTPS listeners
      ansible.builtin.command: ss -H -ltn
      register: https_listeners
      changed_when: false
      when: megaproxy_services.https is defined and megaproxy_services.https.enabled | bool

    - name: Require every GOST backend on loopback
      ansible.builtin.assert:
        that: "'127.0.0.1:' ~ (item.backend_port | string) in https_listeners.stdout"
        fail_msg: "GOST backend {{ item.name }} is not listening on loopback port {{ item.backend_port }}"
      loop: "{{ megaproxy_https_public_routes | default([]) }}"
      when: megaproxy_services.https is defined and megaproxy_services.https.enabled | bool

    - name: Validate sshd configuration
      ansible.builtin.command: sshd -t
      changed_when: false
      when: megaproxy_services.ssh is defined and megaproxy_services.ssh.enabled | bool

    - name: Read MegaProxy SSH host fingerprint
      ansible.builtin.command: ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub
      register: ssh_fingerprint
      changed_when: false
      when: megaproxy_services.ssh is defined and megaproxy_services.ssh.enabled | bool

    - name: Show SSH host fingerprint
      ansible.builtin.debug:
        var: ssh_fingerprint.stdout
      when: ssh_fingerprint is not skipped

    - name: Check HTTPS container
      ansible.builtin.command: docker inspect --format={{ '{{' }}.State.Running{{ '}}' }} megaproxy-gost
      register: gost_health
      changed_when: false
      when: megaproxy_services.https is defined and megaproxy_services.https.enabled | bool

    - name: Require healthy HTTPS proxy
      ansible.builtin.assert:
        that: gost_health.stdout == "true"
        fail_msg: >-
          The GOST container is not running (Running={{ gost_health.stdout }}).
          Inspect it with: journalctl -u megaproxy-gost.service -n 50 --no-pager
      when: gost_health is not skipped

    - name: Verify unauthenticated HTTPS gets a decoy instead of proxy challenge
      ansible.builtin.command:
        argv: >-
          {{
            ['curl', '--silent', '--show-error', '--fail', '--max-time', '15',
             '--write-out', '\n%{http_code}']
            + (['--insecure'] if megaproxy_services.https.certificate == 'self-signed' else [])
            + ['https://' ~ item.hostname ~ ':' ~ (item.port | string) ~ '/']
          }}
      register: decoy_response
      changed_when: false
      delegate_to: localhost
      become: false
      loop: "{{ megaproxy_https_public_routes | default([]) }}"
      when:
        - megaproxy_services.https is defined
        - megaproxy_services.https.enabled | bool
        - megaproxy_services.https.probe_resistance.enabled | bool

    - name: Ensure decoy does not disclose proxy software
      ansible.builtin.assert:
        that:
          - item.rc == 0
          - item.stdout.endswith('\n200')
          - "'proxy-authenticate' not in (item.stdout | lower)"
          - "'gost' not in (item.stdout | lower)"
          - "'megaproxy' not in (item.stdout | lower)"
      loop: "{{ decoy_response.results | default([]) }}"
      when: megaproxy_services.https is defined and megaproxy_services.https.enabled | bool

    - name: Probe CONNECT without credentials
      ansible.builtin.command:
        argv:
          - curl
          - --verbose
          - --max-time
          - "15"
          - --proxy-insecure
          - --proxy
          - "https://{{ megaproxy_services.https.endpoint }}:{{ megaproxy_services.https.port }}"
          - "https://example.com/"
      register: unauthenticated_connect
      changed_when: false
      failed_when: false
      delegate_to: localhost
      become: false
      when:
        - megaproxy_services.https is defined
        - megaproxy_services.https.enabled | bool
        - megaproxy_services.https.probe_resistance.enabled | bool

    - name: Ensure an active probe does not receive a proxy challenge
      ansible.builtin.assert:
        that:
          - "'response 407' not in (unauthenticated_connect.stderr | lower)"
          - "'http/1.1 407' not in (unauthenticated_connect.stderr | lower)"
          - "'http/2 407' not in (unauthenticated_connect.stderr | lower)"
        fail_msg: "The unauthenticated probe received an actual HTTP 407 proxy challenge"
      when: unauthenticated_connect is not skipped

    - name: Probe authenticated HTTPS CONNECT
      ansible.builtin.command:
        argv:
          - curl
          - --verbose
          - --max-time
          - "30"
          - --proxy-insecure
          - --proxy
          - "https://{{ megaproxy_services.https.endpoint }}:{{ megaproxy_services.https.port }}"
          - --proxy-user
          - "{{ megaproxy_services.https.users[0].name }}:{{ megaproxy_services.https.users[0].password }}"
          - "https://example.com/"
      register: authenticated_connect
      changed_when: false
      failed_when: false
      no_log: true
      delegate_to: localhost
      become: false
      when: megaproxy_services.https is defined and megaproxy_services.https.enabled | bool

    - name: Require successful authenticated HTTPS CONNECT
      ansible.builtin.assert:
        that:
          - >-
            authenticated_connect.rc == 0 or
            'CONNECT tunnel established, response 200' in authenticated_connect.stderr
        fail_msg: >-
          Authenticated CONNECT was not established. The curl output is hidden because it may
          contain proxy credentials; inspect the GOST service journal for authentication errors.
      when: megaproxy_services.https is defined and megaproxy_services.https.enabled | bool

    - name: Read exit IP through each HTTPS chain entry
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --show-error
          - --fail
          - --max-time
          - "30"
          - --proxy-insecure
          - --proxy
          - "https://{{ item.hostname }}:{{ megaproxy_services.https.port }}"
          - --proxy-user
          - "{{ megaproxy_services.https.users[0].name }}:{{ megaproxy_services.https.users[0].password }}"
          - http://api.ipify.org/
      loop: "{{ megaproxy_services.get('https', {}).get('routes', []) | selectattr('chain') | list }}"
      register: chain_entry_ips
      changed_when: false
      no_log: true
      delegate_to: localhost
      become: false

    - name: Read IP through each direct exit proxy
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --show-error
          - --fail
          - --max-time
          - "30"
          - --proxy-insecure
          - --proxy
          - "https://{{ item.chain.host }}:{{ item.chain.port }}"
          - --proxy-user
          - "{{ megaproxy_services.https.users[0].name }}:{{ megaproxy_services.https.users[0].password }}"
          - http://api.ipify.org/
      loop: "{{ megaproxy_services.get('https', {}).get('routes', []) | selectattr('chain') | list }}"
      register: chain_exit_ips
      changed_when: false
      no_log: true
      delegate_to: localhost
      become: false

    - name: Require chain traffic to use the configured exit
      ansible.builtin.assert:
        that:
          - chain_entry_ips.results[item].stdout | trim == chain_exit_ips.results[item].stdout | trim
          - chain_entry_ips.results[item].stdout | trim | length > 0
        fail_msg: "HTTPS chain route did not produce the same public IP as its configured exit"
      loop: "{{ range(0, chain_entry_ips.results | default([]) | length) | list }}"
